<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creeping Hunger · the *Privacy Not Included format, live on any product page</title>
<link rel="stylesheet" href="/ui/ui.css"><style>body{max-width:560px;margin:0 auto}</style></head>
<body>
<header><img src="/ui/icon.svg" alt="" width="34"><div><h1>Creeping Hunger</h1><p class="tag">the *Privacy Not Included format, live on any product page · open-weight models via Mozilla.ai Otari</p></div></header>
<div class="controls">
  <input id="url" placeholder="Paste a product page URL" value="https://www.fitbit.com/global/us/products/trackers/charge6">
  <button id="go">Review it</button>
  <div class="small">Try: <a href="#" data-u="https://www.fitbit.com/global/us/products/trackers/charge6">Fitbit Charge 6</a> ·
   <a href="#" data-u="hostile">hostile test page</a></div>
  <label class="small"><input type="checkbox" id="fallback"> Force the judge fallback (demo)</label>
</div>
<main id="app"></main>
<p class="small"><a href="/">About Creeping Hunger</a> · <a href="/#/dashboard">Dashboard</a></p>
<script src="/ui/ui.js"></script>
<script>
  // API base: this page's own origin (the public backend). Override with ?api=http://127.0.0.1:8787
  const qs = new URLSearchParams(location.search);
  if (qs.has("api")) { const v = (qs.get("api") || "").trim().replace(/\/$/, ""); v ? localStorage.setItem("chApiBase", v) : localStorage.removeItem("chApiBase"); }
  const API = localStorage.getItem("chApiBase") || location.origin;
  let id = localStorage.getItem("chInstall"); if (!id) { id = crypto.randomUUID(); localStorage.setItem("chInstall", id); }
  document.querySelectorAll("[data-u]").forEach(a => a.onclick = (e) => { e.preventDefault();
    document.getElementById("url").value = a.dataset.u === "hostile" ? location.origin + "/hostile/" : a.dataset.u; });
  document.getElementById("go").onclick = () => CH.run({ backend: API, url: document.getElementById("url").value.trim(),
    install_id: id, force_fallback: document.getElementById("fallback").checked,
    root: document.getElementById("app"), button: document.getElementById("go") });
  const replayId = new URLSearchParams(location.search).get("review");
  if (replayId) fetch(`${API}/api/reviews/${replayId}`).then(r => r.json()).then(d => CH.replay(d.events, document.getElementById("app"), { backend: API, install_id: id }));
</script></body></html>
